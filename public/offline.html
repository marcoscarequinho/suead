<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão — EducaAI</title>
  <style>
    :root { --primary: #4f46e5; --dark: #0f172a; --gray: #64748b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background: #f8fafc; color: var(--dark); text-align: center;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
    }
    .caixa { max-width: 26rem; display: grid; gap: 1rem; justify-items: center; }
    img { width: 84px; height: 84px; border-radius: 20px; }
    h1 { font-size: 1.5rem; letter-spacing: -.02em; }
    p { color: var(--gray); line-height: 1.6; }
    button {
      margin-top: .5rem; padding: .7rem 1.35rem; border: 0; border-radius: 10px;
      background: var(--primary); color: #fff; font: inherit; font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <img src="/icons/icone-192.png" alt="EducaAI">
    <h1>Você está sem conexão</h1>
    <p>O EducaAI precisa de internet para carregar as aulas e falar com os
      professores avatares. Assim que a conexão voltar, é só recarregar.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
